# Tiny Tapeout project information
project:
  title:        "Digital Lock FSM 4x4"      # Project title
  author:       "Paulino Robledo"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "4-digit electronic lock with 4x4 matrix keypad, anti-bounce and lock after 3 failed attempts"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:    10000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 3x4 or 4x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_Parofi_cerradura_fsm"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_um_Parofi_cerradura_fsm.v"
    - "asic_cerradura_core.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
   # Entradas dedicadas (ui_in[7:0])
  ui[0]: "Fila 0 del teclado matricial (pull-up activo en bajo)"
  ui[1]: "Fila 1 del teclado matricial (pull-up activo en bajo)"
  ui[2]: "Fila 2 del teclado matricial (pull-up activo en bajo)"
  ui[3]: "Fila 3 del teclado matricial (pull-up activo en bajo)"
  ui[4]: "Interruptor de llave fisico (prog_en: habilita programacion y desbloqueo maestro)"
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Salidas dedicadas (uo_out[7:0])
  uo[0]: "Columna 0 del teclado matricial (barrido activo en bajo)"
  uo[1]: "Columna 1 del teclado matricial (barrido activo en bajo)"
  uo[2]: "Columna 2 del teclado matricial (barrido activo en bajo)"
  uo[3]: "Columna 3 del teclado matricial (barrido activo en bajo)"
  uo[4]: "LED unlock (1 = cerradura abierta)"
  uo[5]: "LED error (1 = intento de clave incorrecto)"
  uo[6]: "LED locked (1 = bloqueo de seguridad tras 3 fallos)"
  uo[7]: "LED prog_mode (1 = modo programacion de nueva clave activo)"

  # Pines bidireccionales (uio[7:0])
  uio[0]: "Salida ready (1 = cerradura lista en reposo para recibir 1er digito)"
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# No modificar
yaml_version: 6
